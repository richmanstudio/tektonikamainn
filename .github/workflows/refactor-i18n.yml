name: Refactor i18n and validate build

on:
  push:
    branches: [main]
    paths:
      - "scripts/refactor-i18n.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: i18n-refactor-main
  cancel-in-progress: false

jobs:
  refactor-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Split i18n source
        run: node scripts/refactor-i18n.mjs

      - name: Validate production build
        run: npm run build

      - name: Commit generated i18n modules
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No i18n changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n.tsx src/i18n
          git commit -m "refactor: split i18n dictionaries by locale"
          git pull --rebase origin main
          git push origin HEAD:main
