name: Optimize images and validate SEO build

on:
  push:
    branches:
      - agent/seo-performance
    paths:
      - "src/assets/**"
      - "scripts/optimize-images.mjs"
      - ".github/workflows/optimize-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install image encoder
        run: npm install --no-save --package-lock=false sharp@0.34.3

      - name: Convert and compress raster assets
        run: node scripts/optimize-images.mjs

      - name: Validate production build
        run: npm run build

      - name: Commit optimized assets
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No image changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: optimize raster assets"
          git push
