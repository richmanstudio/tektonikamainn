name: Fix production dependency advisories

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-deps-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-dependency-fix
  cancel-in-progress: false

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Update lockfile with non-breaking audit fixes
        shell: bash
        run: |
          # npm exits non-zero when dev-only advisories remain; the next dedicated
          # production audit is the deployment gate we care about here.
          npm audit fix --package-lock-only || true

      - name: Reinstall updated dependency tree
        run: npm ci

      - name: Verify production dependency security
        run: npm audit --omit=dev --audit-level=high

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build

      - name: Commit dependency lock updates
        shell: bash
        run: |
          if git diff --quiet package.json package-lock.json; then
            echo "No dependency updates required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: update vulnerable production dependencies"
          git pull --rebase origin main
          git push origin HEAD:main
